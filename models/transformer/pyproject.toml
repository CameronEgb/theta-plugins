[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theta-model-transformer"
version = "1.0.0"
description = "Transformer attention architectures for Theta-IDE"
authors = [{ name = "Theta-IDE Team" }]
dependencies = ["torch"]

[project.entry-points."theta.models"]
transformer = "src.usr.models.transformer.transformer_model:SepsisTransformerPolicy"
cross_attention = "src.usr.models.transformer.transformer_model:CrossAttentionSepsisPolicy"
