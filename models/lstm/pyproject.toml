[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theta-model-lstm"
version = "1.0.0"
description = "LSTM recurrent network architecture for Theta-IDE"
authors = [{ name = "Theta-IDE Team" }]
dependencies = ["torch"]

[project.entry-points."theta.models"]
lstm = "src.usr.models.lstm.lstm_model:LSTMModel"
