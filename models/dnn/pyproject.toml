[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theta-model-dnn"
version = "1.0.0"
description = "Standard Deep Neural Network (MLP) component for Theta-IDE"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
]

[project.entry-points."theta.models"]
dnn = "src.usr.models.dnn:DNNModel"
mlp = "src.usr.models.dnn:DNNModel"
