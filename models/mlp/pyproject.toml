[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theta-model-mlp"
version = "1.0.0"
description = "Multi-Layer Perceptron (MLP) architectures for Theta-IDE"
authors = [{ name = "Theta-IDE Team" }]
dependencies = ["torch"]

[project.entry-points."theta.models"]
mlp = "src.usr.models.mlp.mlp_model:MLPQNetwork"
mlp_classifier = "src.usr.models.mlp.mlp_model:MLPClassifier"
