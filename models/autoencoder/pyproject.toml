[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theta-model-autoencoder"
version = "1.0.0"
description = "Autoencoder architectures for Theta-IDE"
authors = [{ name = "Theta-IDE Team" }]
dependencies = ["torch"]

[project.entry-points."theta.models"]
autoencoder = "src.usr.models.autoencoder.autoencoder_model:SequenceAutoencoder"
dense_autoencoder = "src.usr.models.autoencoder.autoencoder_model:DenseAutoencoder"
