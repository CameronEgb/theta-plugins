[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theta-model-dueling-resnet"
version = "1.0.0"
description = "Dueling Residual Network component for Theta-IDE"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
]

[project.entry-points."theta.models"]
dueling_resnet = "src.usr.models.dueling_resnet:DuelingResNetMLP"
resnet = "src.usr.models.dueling_resnet:DuelingResNetMLP"
