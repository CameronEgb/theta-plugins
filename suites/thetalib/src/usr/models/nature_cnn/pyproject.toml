[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "theta-model-nature-cnn"
version = "1.0.0"
description = "Canonical Nature CNN component for Theta-IDE"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
]

[project.entry-points."theta.models"]
nature_cnn = "src.usr.models.nature_cnn:NatureCNNActor"
cnn = "src.usr.models.nature_cnn:NatureCNNActor"
